spring.application.name=order-service
server.port=8097

spring.datasource.url=jdbc:postgresql://localhost:5432/ecom_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=order_service

spring.flyway.enabled=true
spring.flyway.schemas=order_service
spring.flyway.default-schema=order_service
spring.flyway.table=order_service_schema_history
spring.cloud.compatibility-verifier.enabled=false

# Expose Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Show health details
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true
spring.config.import=classpath:kafka-producer.properties

